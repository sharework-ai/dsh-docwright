<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="docwright">
  <!--
    docwright logo: a convergence loop — the product's core mechanic.
    Two arrow arcs chase each other around a rounded-square frame (the
    document outline), and the accent check sits at the center: generate,
    validate, repair until green. No document glyph, no braces: the mark is
    a cycle, and stays legible at 16 px.

    Theme adaptation: the ink CSS variable follows the system light/dark
    preference via the embedded media query; the accent keeps enough
    contrast in either palette.
  -->
  <style>
    :root {
      --ink: #1f2933;
      --accent: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6eaf0;
        --accent: #a78bfa;
      }
    }
    .ink { stroke: var(--ink); }
    .accent { stroke: var(--accent); }
  </style>

  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- loop arcs: the rounded-square frame, broken where the arrows are -->
    <path class="ink" d="M32 13h10q9 0 9 9v7"/>
    <path class="ink" d="M51 36v6q0 9-9 9H32"/>
    <path class="ink" d="M32 51H22q-9 0-9-9v-7"/>
    <path class="ink" d="M13 28v-6q0-9 9-9h10"/>
    <!-- arrowheads: clockwise chase -->
    <path class="ink" d="M45 31l6 6-6 6"/>
    <path class="ink" d="M19 33l-6-6 6-6"/>
    <!-- the check at the loop's center -->
    <path class="accent" stroke-width="7" d="M23 32.5l7 8.5L44 21"/>
  </g>
</svg>
