<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="docwright">
  <!--
    docwright logo: a pair of JSON braces cradling a validation check.
    Braces say "documents are JSON"; the check says "every artifact is
    machine checked"; together they read as a harness holding what the
    model writes. No document glyph: the mark stays legible at 16 px.

    Theme adaptation: the ink CSS variable follows the system light/dark
    preference via the embedded media query; the accent keeps enough
    contrast in either palette.
  -->
  <style>
    :root {
      --ink: #1f2933;
      --accent: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6eaf0;
        --accent: #a78bfa;
      }
    }
    .ink { stroke: var(--ink); }
    .accent { stroke: var(--accent); }
  </style>

  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- left brace: top tip, waist spike, bottom tip -->
    <path class="ink" d="M25 7c-7 0-5 12-12 20-1 1.1-2.2 2-3.5 2.5 1.3 0.5 2.5 1.4 3.5 2.5 7 8 5 20 12 20"/>
    <!-- right brace: mirrored -->
    <path class="ink" d="M39 7c7 0 5 12 12 20 1 1.1 2.2 2 3.5 2.5-1.3 0.5-2.5 1.4-3.5 2.5-7 8-5 20-12 20"/>
    <!-- the check: a touch wider than the waist so it "locks" the braces -->
    <path class="accent" stroke-width="7" d="M27 32.5l7.5 9L51 20"/>
  </g>
</svg>
