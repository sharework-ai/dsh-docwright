<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
  <style>
    text { font-family: sans-serif; fill: #1f2933; }
    .title { font-size: 16px; font-weight: bold; }
    .label { font-size: 13px; font-weight: bold; }
    .small { font-size: 11px; fill: #52606d; }
    .box  { fill: #f5f7fa; stroke: #52606d; stroke-width: 1.2; }
    .gate { fill: #eef4fb; stroke: #2f6db3; stroke-width: 1.5; }
    .ok   { fill: #eef7ee; stroke: #3d8b4f; stroke-width: 1.2; }
    .warn { fill: #fdf3e7; stroke: #d48806; stroke-width: 1.2; }
    .line { stroke: #7b8794; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
  </style>
  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">参数确认门判定流程</text>

  <!-- start -->
  <rect x="360" y="45" width="160" height="36" class="box" rx="18"/>
  <text x="440" y="67" text-anchor="middle" class="small">doc_generate 带 params 调用</text>

  <!-- resolve order -->
  <rect x="300" y="105" width="280" height="106" class="box" rx="6"/>
  <text x="440" y="127" text-anchor="middle" class="label">参数解析顺序</text>
  <text x="440" y="148" text-anchor="middle" class="small">显式 params 传入</text>
  <text x="440" y="166" text-anchor="middle" class="small">上游回执继承</text>
  <text x="440" y="184" text-anchor="middle" class="small">素材抽取值（须过引文验证）</text>
  <text x="440" y="199" text-anchor="middle" class="small">声明默认值；required 缺失即报错</text>
  <line x1="440" y1="81" x2="440" y2="103" class="line"/>

  <!-- required check -->
  <rect x="330" y="228" width="220" height="52" class="gate" rx="6"/>
  <text x="440" y="250" text-anchor="middle" class="small">required 参数有值？</text>
  <text x="440" y="268" text-anchor="middle" class="small">（如 cfpTotal / targetIndex）</text>
  <line x1="440" y1="213" x2="440" y2="226" class="line"/>

  <rect x="80" y="232" width="180" height="44" class="warn" rx="6"/>
  <text x="170" y="250" text-anchor="middle" class="small">缺失：报错并列出候选</text>
  <text x="170" y="267" text-anchor="middle" class="small">（index / funcId / l2Name）</text>
  <line x1="330" y1="254" x2="262" y2="254" class="line"/>

  <!-- gate decision -->
  <line x1="440" y1="280" x2="440" y2="310" class="line"/>
  <rect x="320" y="312" width="240" height="64" class="gate" rx="6"/>
  <text x="440" y="334" text-anchor="middle" class="small">是否需要确认？（confirmPolicy）</text>
  <text x="440" y="352" text-anchor="middle" class="small">显式改参，或 confirm 参数</text>
  <text x="440" y="368" text-anchor="middle" class="small">未经上游回执确认</text>

  <!-- no-gate path -->
  <line x1="560" y1="344" x2="700" y2="344" class="line"/>
  <rect x="702" y="316" width="160" height="56" class="ok" rx="6"/>
  <text x="782" y="338" text-anchor="middle" class="small">无需确认：直接执行生成</text>
  <text x="782" y="356" text-anchor="middle" class="small">as-run 参数写入回执</text>

  <!-- pending -->
  <line x1="440" y1="376" x2="440" y2="404" class="line"/>
  <rect x="320" y="406" width="240" height="84" class="warn" rx="6"/>
  <text x="440" y="428" text-anchor="middle" class="small">返回 pendingConfirmation 参数表</text>
  <text x="440" y="446" text-anchor="middle" class="small">每行：生效值 / 来源 / 缺失标记</text>
  <text x="440" y="464" text-anchor="middle" class="small">抽取行附素材引文</text>
  <text x="440" y="478" text-anchor="middle" class="small">零模型调用，不执行生成</text>

  <!-- confirm path -->
  <line x1="440" y1="492" x2="440" y2="508" class="line"/>
  <rect x="320" y="510" width="240" height="56" class="ok" rx="6"/>
  <text x="440" y="531" text-anchor="middle" class="small">用户确认后 confirm: true 重发</text>
  <text x="440" y="549" text-anchor="middle" class="small">进入生成闭环，链头确认沿回执继承</text>

  <!-- extract side note -->
  <rect x="40" y="406" width="230" height="74" class="box" rx="6"/>
  <text x="155" y="428" text-anchor="middle" class="small">抽取值来源（doc_extract_params）</text>
  <text x="155" y="447" text-anchor="middle" class="small">quote 须为素材逐字片段</text>
  <text x="155" y="465" text-anchor="middle" class="small">素材变化后需重新抽取</text>
  <line x1="270" y1="446" x2="318" y2="446" class="line"/>
</svg>
