<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <style>
    text { font-family: sans-serif; fill: #1f2933; }
    .title { font-size: 16px; font-weight: bold; }
    .label { font-size: 13px; font-weight: bold; }
    .small { font-size: 11px; fill: #52606d; }
    .box  { fill: #f5f7fa; stroke: #52606d; stroke-width: 1.2; }
    .llm  { fill: #eef4fb; stroke: #2f6db3; stroke-width: 1.2; }
    .chk  { fill: #eef7ee; stroke: #3d8b4f; stroke-width: 1.5; }
    .fail { fill: #fdeceb; stroke: #c0392b; stroke-width: 1.2; }
    .line { stroke: #7b8794; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">doc_generate 生成闭环</text>

  <!-- start -->
  <rect x="370" y="45" width="140" height="34" class="box" rx="17"/>
  <text x="440" y="66" text-anchor="middle" class="small">调用 doc_generate</text>

  <!-- reuse pre-check -->
  <rect x="60" y="120" width="180" height="56" class="chk" rx="6"/>
  <text x="150" y="143" text-anchor="middle" class="small">复用预检</text>
  <text x="150" y="161" text-anchor="middle" class="small">同一批输入已有合格产物？</text>
  <line x1="440" y1="79" x2="440" y2="100" class="line"/>
  <line x1="440" y1="100" x2="150" y2="100" class="line dash"/>
  <line x1="150" y1="100" x2="150" y2="118" class="line"/>
  <rect x="30" y="200" width="240" height="30" class="chk" rx="6"/>
  <text x="150" y="219" text-anchor="middle" class="small">命中：直接返回（reused: true）</text>
  <line x1="150" y1="176" x2="150" y2="198" class="line"/>

  <!-- main loop path -->
  <line x1="440" y1="100" x2="440" y2="128" class="line"/>
  <rect x="360" y="130" width="160" height="44" class="box" rx="6"/>
  <text x="440" y="149" text-anchor="middle" class="small">预算预检</text>
  <text x="440" y="166" text-anchor="middle" class="small">prompt token 是否超限</text>

  <line x1="440" y1="174" x2="440" y2="200" class="line"/>
  <rect x="360" y="202" width="160" height="44" class="llm" rx="6"/>
  <text x="440" y="221" text-anchor="middle" class="small">模型调用</text>
  <text x="440" y="238" text-anchor="middle" class="small">生成 / 修复 prompt</text>

  <line x1="440" y1="246" x2="440" y2="272" class="line"/>
  <rect x="360" y="274" width="160" height="44" class="box" rx="6"/>
  <text x="440" y="293" text-anchor="middle" class="small">解析 JSON</text>
  <text x="440" y="310" text-anchor="middle" class="small">失败按校验问题处理</text>

  <line x1="440" y1="318" x2="440" y2="344" class="line"/>
  <rect x="340" y="346" width="200" height="60" class="chk" rx="6"/>
  <text x="440" y="368" text-anchor="middle" class="small">校验：schema + 领域规则</text>
  <text x="440" y="386" text-anchor="middle" class="small">issue：severity / jsonPath / 建议</text>
  <text x="440" y="399" text-anchor="middle" class="small">合格 = 0 条 error</text>

  <!-- green exit -->
  <line x1="540" y1="376" x2="640" y2="376" class="line"/>
  <rect x="642" y="352" width="210" height="48" class="chk" rx="6"/>
  <text x="747" y="371" text-anchor="middle" class="small">合格：落盘产物 + 回执 + MD</text>
  <text x="747" y="389" text-anchor="middle" class="small">返回 receipt 与 summary</text>

  <!-- repair loop back -->
  <line x1="340" y1="376" x2="240" y2="376" class="line"/>
  <rect x="60" y="300" width="180" height="110" class="box" rx="6"/>
  <text x="150" y="325" text-anchor="middle" class="small">收敛检测（oscillation.mode）</text>
  <text x="150" y="345" text-anchor="middle" class="small">评分模式：连续 K 轮不超最优</text>
  <text x="150" y="363" text-anchor="middle" class="small">或连续 D 轮下行即终止</text>
  <text x="150" y="383" text-anchor="middle" class="small">指纹模式：连续 N 轮相同即终止</text>
  <text x="150" y="401" text-anchor="middle" class="small">未触发且未达轮数上限则继续</text>
  <line x1="150" y1="298" x2="150" y2="188" class="line"/>
  <line x1="150" y1="188" x2="330" y2="188" class="line"/>
  <line x1="330" y1="188" x2="330" y2="224" class="line"/>
  <line x1="330" y1="224" x2="358" y2="224" class="line"/>
  <text x="246" y="182" class="small">进入下一轮修复</text>

  <!-- failure branch -->
  <line x1="440" y1="406" x2="440" y2="430" class="line"/>
  <rect x="330" y="432" width="220" height="86" class="fail" rx="6"/>
  <text x="440" y="454" text-anchor="middle" class="small">失败：耗尽 / 收敛触发 / 模型失败</text>
  <text x="440" y="474" text-anchor="middle" class="small">工具报错（fails loud）</text>
  <text x="440" y="492" text-anchor="middle" class="small">红标草稿 + 不合格回执保留在磁盘</text>
  <text x="440" y="510" text-anchor="middle" class="small">人工修复后可经 doc_validate 封章入链</text>

  <!-- round cap note -->
  <text x="40" y="530" class="small">轮数上限：maxRounds 参数 &gt; pack 声明 &gt; maxIterations（默认 5），</text>
  <text x="40" y="546" class="small">绝对上限 maxRoundsCeiling（默认 10）不可突破</text>
</svg>
